name: PR Hygiene - Jira Ticket in Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-jira-ticket:
    uses: aerospike/shared-workflows/.github/workflows/reusable_pr-hygiene.yml@cadeba5cc6b45f18928d94cbbaf66095e0e62a7d # v3.9.0
    with:
      pr_title: ${{ github.event.pull_request.title }}
