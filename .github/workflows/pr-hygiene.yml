name: PR Hygiene - Jira Ticket in Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-jira-ticket:
    uses: aerospike/shared-workflows/.github/workflows/reusable_pr-hygiene.yml@7b61b675476430553f09b94419ca18802d697e98 # v3.4.0
    with:
      pr_title: ${{ github.event.pull_request.title }}
